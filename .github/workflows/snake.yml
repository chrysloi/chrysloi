name: Contribution snake

# Regenerates the contribution-graph snake shown in the README and publishes it
# to the `output` branch, which the README reads from via raw.githubusercontent.
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/snake.yml]

permissions:
  contents: write

concurrency:
  group: snake
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          # Snake in the portfolio accent; dots keep GitHub's own palette so
          # the graph still reads as a contribution graph.
          outputs: |
            dist/snake-light.svg?color_snake=#007a6b
            dist/snake-dark.svg?palette=github-dark&color_snake=#00e5c8

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          commit_message: "chore: update contribution snake"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
